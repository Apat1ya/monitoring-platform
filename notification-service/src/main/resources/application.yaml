server:
  port: 8085

spring:
  application:
    name: notification-service

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}



  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: file:./.secrets/jwt/public.pem

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: monitor-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer

  datasource:
    url: jdbc:postgresql://localhost:5432/monitor_db
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

app:
  kafka:
    topics:
      notification-subscription: ${KAFKA_TOPIC_NOTIFICATION_SUBSCRIPTION:monitor.notification-subscription}
      user-registered: ${KAFKA_TOPIC_USER_REGISTERED:auth.user-registered}
      state-changed: ${KAFKA_TOPIC_STATE_CHANGED:incident.state-changed}
      email-change-requested: ${KAFKA_TOPIC_EMAIL_CHANGE:auth.email-change-requested}
      user-email-changed: ${KAFKA_TOPIC_USER_EMAIL_CHANGED:auth.user-email-changed}

  email:
    confirm-url: ${EMAIL_CONFIRM_URL:http://localhost:8084/users/email/confirm}

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME}

