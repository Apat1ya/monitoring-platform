spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
                - Path=/auth/**
            - id: monitor-service
              uri: http://localhost:8082
              predicates:
                - Path=/monitors/**

            - id: incident-service
              uri: http://localhost:8083
              predicates:
                - Path=/incidents/**